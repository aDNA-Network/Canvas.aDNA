[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adna-canvas-std"
version = "0.1.0"
description = "Reference implementation of the aDNA Canvas Standard (validators, round-trip converters, conformance harness)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "aDNA Labs / Canvas.aDNA (Mondrian)" }]
keywords = ["canvas", "json-canvas", "obsidian", "adna", "standard", "conformance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
]
dependencies = []  # zero-dependency core (stdlib only); the Standard floor needs no third-party runtime

[project.optional-dependencies]
# ⛩ `jsonschema` added at Operation Datum P4b (2026-09-15) — DEV ONLY, and the distinction is the
# point. The runtime promise above is unchanged: nothing under `src/` imports it, and the reference
# validator stays stdlib. It is here because `tests/test_schema_conformance.py` validates the fixture
# corpus against the PUBLISHED JSON Schema, which until P4b nothing did — `certification` exercises
# the *validator's* verdicts, and the schema is an independent second copy of eleven vocabularies
# (F-DT-7). ⚠ It was already importable in this vault's runner by accident of the anaconda
# environment, i.e. an UNDECLARED dependency the gate preconditions do not check; declaring it here
# is what makes the suite reproducible off this node.
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.18"]  # >=4.18 for Draft 2020-12 validator stability

[project.scripts]
canvas-std = "canvas_std.conformance:_cli"  # conformance CLI — wired at E2.3

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_std"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
